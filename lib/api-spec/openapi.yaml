openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Romantic surprise order requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a romantic surprise order request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OrderItemInput:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 20
      required: [productId, quantity]
    OrderInput:
      type: object
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 100
        recipientName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          minLength: 7
          maxLength: 30
        email:
          type: ["string", "null"]
          format: email
        occasion:
          type: string
          minLength: 2
          maxLength: 80
        deliveryAddress:
          type: string
          minLength: 5
          maxLength: 300
        eventDate:
          type: ["string", "null"]
          format: date
        note:
          type: ["string", "null"]
          maxLength: 1000
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/OrderItemInput"
      required: [customerName, recipientName, phone, occasion, deliveryAddress, items]
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
      required: [productId, name, quantity, unitPrice]
    Order:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        recipientName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        occasion:
          type: string
        deliveryAddress:
          type: string
        eventDate:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - customerName
        - recipientName
        - phone
        - email
        - occasion
        - deliveryAddress
        - eventDate
        - note
        - items
        - total
        - status
        - createdAt

